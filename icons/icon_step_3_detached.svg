<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#DC2626" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
  <!-- Parsel dış sınır -->
  <rect x="2" y="2" width="20" height="20" rx="1" stroke-dasharray="3 2" opacity="0.35"/>
  <!-- Ayrık bina (ortada, boşluklu) -->
  <rect x="5" y="5" width="14" height="14" rx="0.5" fill="#DC262618"/>
  <!-- Açık boşluklar (dört taraf setback) -->
  <line x1="2" y1="5" x2="5" y2="5" stroke-width="1.2" opacity="0.5"/>
  <line x1="19" y1="5" x2="22" y2="5" stroke-width="1.2" opacity="0.5"/>
  <line x1="2" y1="19" x2="5" y2="19" stroke-width="1.2" opacity="0.5"/>
  <line x1="19" y1="19" x2="22" y2="19" stroke-width="1.2" opacity="0.5"/>
  <!-- "A" etiketi -->
  <text x="12" y="14.5" text-anchor="middle" font-family="sans-serif" font-size="6" font-weight="bold" fill="#DC2626" stroke="none">A</text>
</svg>
