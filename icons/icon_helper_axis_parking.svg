<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- P ikonu arka planı -->
  <rect x="2" y="2" width="20" height="20" rx="3" fill="#1e40af"/>
  <!-- Kesik çizgi (Aks) -->
  <line x1="12" y1="2" x2="12" y2="22" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- Otopark çizgileri (sağ taraf) -->
  <line x1="12" y1="6" x2="20" y2="6" stroke="white" stroke-width="1.5"/>
  <line x1="12" y1="12" x2="20" y2="12" stroke="white" stroke-width="1.5"/>
  <line x1="12" y1="18" x2="20" y2="18" stroke="white" stroke-width="1.5"/>
  <!-- Otopark çizgileri (sol taraf açılı) -->
  <line x1="12" y1="8" x2="4" y2="4" stroke="white" stroke-width="1.5"/>
  <line x1="12" y1="14" x2="4" y2="10" stroke="white" stroke-width="1.5"/>
  <line x1="12" y1="20" x2="4" y2="16" stroke="white" stroke-width="1.5"/>
</svg>
